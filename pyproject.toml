[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "0.0.1"
description = "Event Modelling Bridging Energy deposits and Readout: a lightweight strax-based waveform simulation for LXe TPCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "ember contributors" }]
keywords = ["strax", "fuse", "LXe", "TPC", "simulation", "dark matter"]

# NOTE: strax is not API-stable. Update pins deliberately and only after a green test run.
dependencies = [
    "nestpy>=2.1.3",
    "numba>=0.58",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "strax",
]

[project.optional-dependencies]
abstrax = ["abstrax"]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "hypothesis>=6.0",
    "jupyterlab>=4.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
include = ["ember*"]

[tool.setuptools.package-data]
ember = ["config/*.yaml", "dummy_maps/*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["tests/unit"]
addopts = "-ra --strict-markers --import-mode=importlib"
